[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marione"
version = "2.0.0"
description = "Marione: the Discord bot that keeps the server alive."
requires-python = ">=3.12,<3.13"
dependencies = [
  "discord.py[voice]>=2.4",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "asyncpg-stubs>=0.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marione = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# BLE: no blind `except Exception` (the old bot had 68 of them). Catch what you can handle.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "ASYNC", "RUF", "C4", "PT"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # Italian text with typographic characters is fine
  "PT018",  # `assert a and b` reads fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
